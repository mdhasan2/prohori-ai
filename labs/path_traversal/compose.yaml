services:
  lab:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    
    networks:
      - lab_internal

    read_only: true

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  lab_internal:
    internal: true