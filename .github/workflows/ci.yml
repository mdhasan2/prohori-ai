name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      
      - name: Install Python
        run: uv python install 3.12

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Check lock-file consistency
        run: uv lock --check

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run lint checks
        run: uv run ruff check .

      - name: Run static type checks
        run: uv run mypy src

      - name: Run tests
        env:
          PROHORIAI_ENVIRONMENT: test
          PROHORIAI_REQUIRE_HUMAN_APPROVAL: "true"
        run: uv run pytest




