[project]
name = "prohori-ai"
version = "0.1.0"
description = "A human-governed, closed-loop offensive security agent system"
readme = "README.md"
authors = [
    { name = "Md Hasan", email = "jakirul@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.15.0",
]

[project.scripts]
prohori-ai = "prohori_ai.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version ="py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # Import sorting
    "B",    # Bugbear
    "UP",   # Python syntax upgrades
    "N",    # Naming conentions
    "S",    # Common security issues
    "ANN",  # Type annotations
    "RUF",  # Ruff-specific rules
]

ignore = [
    "S101", # Permit assert statement in tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
show_error_code_links = true
warn_unreachable = true
mypy_path = "src"
packages = ["prohori_ai"]

[tool.uv.build-backend]
module-name = "prohori_ai"
module-root = "src"

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=prohori_ai",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
markers = [
    "integration: tests involving multiple components or external boundaries",
]

